name: Build and Release PolyModLoader app

on:
  push:
    tags:
      - 'v0.6.*'

jobs:
  build-desktop:
    runs-on: node-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up packages
        run: apt-get update && apt-get install -y rsync curl zip jq

      - name: Make folder structure
        run: |
          mkdir -p temp temp/pml platforms
          
          rsync -a --quiet --exclude=temp/ --exclude=.git/ --exclude=.woodpecker/ --exclude=.forgejo ./ temp/pml/

      - name: Write PML build to package.json
        env:
          TAG: ${{ forgejo.ref_name }}
        run: |
          jq '.pmlBuild = "'$TAG'"' package.json > package.json.tmp && mv package.json.tmp package.json

      - name: install npm packages
        run: |
          cd temp/pml
          npm install
          cd ../../

      - name: build and compress slopOS(Windows) app
        run: |
          cd temp/pml
          npm run package-win
          zip -rq ../../platforms/PolyModLoader-win32-x64.zip PolyModLoader-win32-x64
          cd ../../

      - name: build and compress Linux app
        run: |
          cd temp/pml
          npm run package-linux
          tar -czf ../../platforms/PolyModLoader-linux-x64.tar.gz PolyModLoader-linux-x64
          cd ../../

      - name: build and compress MacOS app
        run: |
          cd temp/pml
          npm run package-mac
          zip -rq ../../platforms/PolyModLoader-darwin-x64.zip PolyModLoader-darwin-x64
          cd ../../

      - name: copy app.asar to platforms
        run: |
          cp temp/pml/PolyModLoader-win32-x64/resources/app.asar platforms/app.asar

      - name: Trigger GitHub workflow run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: CRJakob/PolyModLoader  # adjust to your actual GitHub repo
        run: |
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$GH_REPO/actions/workflows/main.yml/dispatches" \
            -d '{
              "ref": "main",
              "inputs": {
                "tag": "'"$TAG"'"
              }
            }'
          echo "iOS build triggered, waiting for completion..."
      - name: Wait for GitHub workflow and download IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: CRJakob/PolyModLoader
        run: |
          MAX_ATTEMPTS=60
          ATTEMPT=0
          RUN_ID=""
          
          # Poll for the latest workflow run
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            RUNS=$(curl -s -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$GH_REPO/actions/workflows/main.yml/runs?per_page=1")
          
            # Get the most recent run
            RUN_ID=$(echo "$RUNS" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
            RUN_STATUS=$(echo "$RUNS" | grep -o '"status":"[^"]*' | head -1 | cut -d'"' -f4)
          
            echo "Run $RUN_ID status: $RUN_STATUS"
          
            if [ "$RUN_STATUS" = "completed" ]; then
              echo "Workflow completed!"
              break
            fi
          
            ATTEMPT=$((ATTEMPT + 1))
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              sleep 5
            fi
          done
          
          if [ "$RUN_STATUS" != "completed" ]; then
            echo "Timeout waiting for workflow to complete"
            exit 1
          fi
          # Get artifacts
          ARTIFACTS=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$GH_REPO/actions/runs/$RUN_ID/artifacts")

          DOWNLOAD_URL=$(echo "$ARTIFACTS" | grep -o '"download_url":"[^"]*' | head -1 | cut -d'"' -f4)

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "No artifacts found!"
            exit 1
          fi

          echo "Downloading artifacts from: $DOWNLOAD_URL"
          curl -s -L -H "Authorization: token $GH_TOKEN" \
            -o artifacts.zip \
            "$DOWNLOAD_URL"

          unzip -q artifacts.zip
          mv ios-ipa/PolyModLoader.ipa platforms/ || true

          echo "IPA downloaded to platforms/PolyModLoader.ipa"

  create-release:
    runs-on: alpine-latest
    steps:
      - uses: actions/checkout@v4
        with:
          direction: upload
          release-dir: platforms